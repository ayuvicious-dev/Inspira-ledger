<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspira Ledger — Akuntansi Terintegrasi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C2620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspira Ledger">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E8;
  --paper:#FFFDF9;
  --ink:#2C2620;
  --ink-soft:#6B6055;
  --terracotta:#C1603D;
  --terracotta-dark:#9E4B2F;
  --sage:#7C8B6F;
  --sage-soft:#E4E9DE;
  --line:#E4DACB;
  --debit:#2F6B4F;
  --kredit:#B0432C;
  --warn:#C88A2A;
  --shadow: 0 1px 2px rgba(44,38,32,.06), 0 4px 14px rgba(44,38,32,.05);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink)}
body{font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:'Poppins',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13.5px}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#D8CBB4;border-radius:8px}

/* ---- shell ---- */
#shell{display:flex;min-height:100vh}
#sidebar{
  width:236px;flex:none;background:linear-gradient(180deg,#2C2620,#241F1A);
  color:#EFE7DA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--terracotta),var(--terracotta-dark));display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;color:#fff;font-size:16px;margin-bottom:10px}
#brand h1{font-size:16.5px;color:#fff}
#brand p{margin:2px 0 0;font-size:11px;color:#B7AB98;letter-spacing:.04em;text-transform:uppercase}
nav{padding:10px 10px 20px;flex:1}
.navgroup{margin-top:14px}
.navgroup .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8B7F6E;padding:6px 10px 4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:#D8CDBC;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.3px;margin-bottom:1px;transition:.12s}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.active{background:var(--terracotta);color:#fff;font-weight:600}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#topbar h2{font-size:19px}
#topbar .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
#topbar-actions{display:flex;gap:8px;align-items:center}
#content{padding:24px 28px 60px;max-width:1360px;width:100%}

/* ---- generic components ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}

.kpi .label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .value{font-family:'Poppins';font-size:22px;margin-top:6px;font-weight:600}
.kpi .value.pos{color:var(--debit)}
.kpi .value.neg{color:var(--kredit)}

.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--terracotta);color:var(--terracotta-dark)}
.btn.primary{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.btn.primary:hover{background:var(--terracotta-dark);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--kredit)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:7px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.section-title h3{font-size:15.5px}
.section-title .hint{font-size:12px;color:var(--ink-soft)}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table.sheet{min-width:100%}
table.sheet thead th{
  position:sticky;top:0;background:#F1E9DC;color:var(--ink);font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;
  padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
}
table.sheet tbody td{padding:7px 10px;border-bottom:1px solid #EFE7D9;font-size:13px;white-space:nowrap}
table.sheet td.wrap-cell{white-space:normal;min-width:160px;max-width:280px}
table.sheet td select{min-width:118px}
table.sheet td input{min-width:90px}
table.sheet td.wrap-cell input{min-width:160px}
table.sheet tbody tr:hover{background:#FBF6EC}
table.sheet tbody tr:last-child td{border-bottom:none}
table.sheet td input,table.sheet td select{border:1px solid transparent;background:transparent;width:100%;padding:4px 5px;border-radius:6px}
table.sheet td input:hover,table.sheet td select:hover{border-color:var(--line)}
table.sheet td input:focus,table.sheet td select:focus{outline:none;border-color:var(--terracotta);background:#fff}
.num{font-variant-numeric:tabular-nums;text-align:right}
.center{text-align:center}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.pribadi{background:#E9E2F3;color:#5B4A8A}
.tag.a{background:#DDEBE0;color:#2F6B4F}
.tag.b{background:#FCE8D9;color:#B0602A}
.tag.c{background:#DCEAF3;color:#2D6B8A}
.tag.debit{background:#E4EFE8;color:var(--debit)}
.tag.kredit{background:#F5E1DA;color:var(--kredit)}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-size:11.3px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:38px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}

.tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs2 button{background:none;border:none;padding:9px 14px;font-size:13.3px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.active{color:var(--terracotta-dark);border-color:var(--terracotta)}

.empty{padding:34px 16px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:26px;margin-bottom:6px}

.recap{background:#F1EADC;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:12.8px;display:flex;gap:22px;flex-wrap:wrap}
.recap b{font-family:'Poppins';font-size:14.5px}

.badge-balance{padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge-balance.ok{background:#DDEBE0;color:var(--debit)}
.badge-balance.bad{background:#F5DAD2;color:var(--kredit)}

.rowline{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}

.loc-block{margin-bottom:16px}
.loc-block h4{font-size:12.8px;color:var(--terracotta-dark);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.3px;margin:0 6px 6px 0}
.chip.low{border-color:var(--kredit);background:#FBEDE8}

.toast{position:fixed;bottom:20px;right:20px;background:#2C2620;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}

.hidden{display:none !important}
.mini{font-size:11.5px;color:var(--ink-soft)}
a.resepLink:hover,a.subResepLink:hover,a.crumbLink:hover{text-decoration:underline !important}
a.crumbLink{color:var(--ink-soft);text-decoration:none}
a.crumbLink:last-child{color:var(--terracotta-dark);font-weight:600}

/* ---- Searchable account picker ---- */
.akunPickerInput{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;color:var(--ink)}
.akunPickerInput:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,96,61,.12)}
.akunPickerList{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow-y:auto;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40}
.akunPickerItem{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F1EADC}
.akunPickerItem:last-child{border-bottom:none}
.akunPickerItem:hover{background:#FBF6EC}

/* ---- Resep grid: vertical cards (image on top, details stacked below) ---- */
.resep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.resep-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column}
.resep-card-img{width:100%;height:140px;background:#F1EADC;display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
.resep-card-img img{width:100%;height:100%;object-fit:cover}
.resep-card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.resep-card-body a.resepLink{color:var(--terracotta-dark);font-weight:700;font-size:14.5px;text-decoration:none;margin-bottom:2px}
.resep-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;padding:2px 0;border-bottom:1px dashed #EEE3D2}
.resep-card-row:last-of-type{border-bottom:none}

/* ---- Mobile layout: off-canvas sidebar, compact tables (BCA Bisnis style) ---- */
#hamburgerBtn{display:none}
#sidebarBackdrop{display:none}
@media(max-width:820px){
  #shell{display:block}
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;width:78vw;max-width:300px;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.25);
  }
  #sidebar.open{transform:translateX(0)}
  #sidebarBackdrop{
    display:none;position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:55;
  }
  #sidebarBackdrop.open{display:block}
  #main{width:100%}
  #hamburgerBtn{
    display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:18px;margin-right:8px;flex:none;
  }
  #topbar{padding:10px 12px;flex-wrap:nowrap;gap:8px}
  #topbar h2{font-size:16px}
  #topbar .sub{display:none}
  #topbar-actions{gap:5px}
  #topbar-actions .btn{padding:6px 9px;font-size:11.5px}
  #userBadge{display:none}
  #content{padding:12px 10px 40px}
  .card{padding:12px 12px;border-radius:11px}
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .value{font-size:16px}
  .kpi .label{font-size:10px}
  .formgrid{grid-template-columns:1fr 1fr;gap:8px}
  .two-col{grid-template-columns:1fr}
  table.sheet thead th{font-size:10px;padding:7px 6px}
  table.sheet tbody td{font-size:12px;padding:6px 6px}
  table.sheet td select,table.sheet td input{font-size:12px;min-width:76px}
  table.sheet td.wrap-cell{min-width:120px;max-width:180px}
  .tablewrap{-webkit-overflow-scrolling:touch;border-radius:9px}
  .section-title{gap:8px}
  .section-title h3{font-size:14px}
  .btn{padding:7px 11px;font-size:12.5px}
  #brand{padding:16px 16px 12px}
  .resep-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .resep-card-img{height:100px;font-size:28px}
  .resep-card-body{padding:8px 10px 10px}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebarBackdrop"></div>
  <aside id="sidebar">
    <div id="brand">
      <div class="mark">IE</div>
      <h1>Inspira Ledger</h1>
      <p>Akuntansi Terpadu</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center">
        <button id="hamburgerBtn">☰</button>
        <div>
          <h2 id="pagetitle">Dashboard</h2>
          <div class="sub" id="pagesub">Ringkasan posisi keuangan</div>
        </div>
      </div>
      <div id="topbar-actions">
        <button class="btn" id="btnExport">⬇ Backup JSON</button>
        <button class="btn" id="btnImport">⬆ Restore</button>
        <input type="file" id="fileImport" accept="application/json" class="hidden">
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   INSPIRA LEDGER — Aplikasi Akuntansi Terpadu (offline, localStorage)
   ============================================================ */
const STORAGE_KEY = 'inspira_ledger_db_v1';
const KEPEMILIKAN = ['Pribadi','Bisnis A','Bisnis B','Bisnis C'];
const KAT = {
  AL:'Aset Lancar', PS:'Aset Persediaan', ALL:'Aset Lancar Lainnya', AT:'Aset Tetap',
  KAT:'Kontra Aset Tetap', ALN:'Aset Lainnya', KW:'Kewajiban', MD:'Modal',
  PD:'Pendapatan', BPP:'Beban Pokok Penjualan', BO:'Beban Operasional', BL:'Beban Lain'
};
/* Fixed display order for account categories, used everywhere a list of accounts is shown
   (COA table, pickers, etc.) so related accounts always group together top-to-bottom. */
const KATEGORI_ORDER = ['AL','PS','ALL','ALN','AT','KAT','KW','MD','PD','BPP','BO','BL'];
function sortAkunList(list){
  return [...list].sort((a,b)=>{
    const oa = KATEGORI_ORDER.indexOf(a.kategori), ob = KATEGORI_ORDER.indexOf(b.kategori);
    if(oa!==ob) return oa-ob;
    if(a.kepemilikan!==b.kepemilikan) return KEPEMILIKAN.indexOf(a.kepemilikan)-KEPEMILIKAN.indexOf(b.kepemilikan);
    return a.nama.localeCompare(b.nama);
  });
}
const DEBIT_NORMAL = new Set(['AL','PS','ALL','AT','ALN','BPP','BO','BL']);
const KREDIT_NORMAL = new Set(['KAT','KW','MD','PD']);
const LOKASI_FREEZER = Array.from({length:13},(_,i)=>'Freezer CH-'+String(i+1).padStart(2,'0'));
const LOKASI_KULKAS  = Array.from({length:6},(_,i)=>'Kulkas SH-'+String(i+1).padStart(2,'0'));
const LOKASI_ALL = [...LOKASI_FREEZER, ...LOKASI_KULKAS];

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtRp(n){ n = Number(n)||0; return 'Rp' + n.toLocaleString('id-ID',{maximumFractionDigits:0}); }
function fmtNum(n,d=2){ n=Number(n)||0; return n.toLocaleString('id-ID',{maximumFractionDigits:d}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function tagClassKep(k){ return k==='Pribadi'?'pribadi':k==='Bisnis A'?'a':k==='Bisnis B'?'b':'c'; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------------- STATE ---------------- */
let DB = null;

function freshDB(){
  return {
    coa:[], jurnal:[], pembelian:[], penjualan:[], pemakaian:[], biaya:[], produk:[], resep:[],
    budgeting:[], budgetKalender:[], counters:{}, tags:[], lokasiCustom:[], barang:[], aset:[],
    users:[], currentUserId:null,
    jenisBahanCustom:[], jenisResepCustom:['Sambal','Bumbu','Minuman','Makanan Utama','Camilan'],
    jenisAsetCustom:['Kendaraan','Mesin','Peralatan','Bangunan','Elektronik','Lainnya'],
    kategoriProdukCustom:['Bahan Mentah','Setengah Jadi','Menu Jadi'],
    satuanCustom:['pcs','gr','kg','ml','l','sdm','sdt','ikat','butir'],
    stepKategoriCustom:['Iris','Potong','Thawing','Blender','Tumis','Rebus','Goreng','Kukus','Oven','Air Fryer','Lainnya'],
    kepemilikanCustom:[]
  };
}

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB = freshDB(); } }
  else { DB = freshDB(); }
  if(!DB.coa || DB.coa.length===0){ seedCOA(); }
  // fill in any fields missing from older saved data
  const fresh = freshDB();
  Object.keys(fresh).forEach(k=>{ if(DB[k]===undefined) DB[k] = fresh[k]; });
  ensureDepresiasiAccounts();
  runOneTimeMigrations();
  save();
}

/* One-time migrations for people upgrading from an older saved version — each runs exactly once
   per browser (guarded by a flag on DB) so re-opening the app doesn't repeat them. */
function runOneTimeMigrations(){
  if(!DB._migrated_clearTrialKalender){
    DB.budgetKalender = []; // old manual trial entries — calendar is now auto-recommended, safe to clear
    DB._migrated_clearTrialKalender = true;
  }
  if(!DB._migrated_seedBudgetKategori){
    MENU_KATEGORI_PRIORITAS.forEach(kat=> ensureInList('jenisResepCustom', kat));
    DB._migrated_seedBudgetKategori = true;
  }
}

function ensureDepresiasiAccounts(){
  KEPEMILIKAN.forEach(kep=>{
    if(!DB.coa.find(a=>a.kategori==='BO' && a.kepemilikan===kep && a.nama==='Beban Penyusutan Aset')){
      addAkun('BO','Beban Penyusutan Aset', kep, 'Otomatis dari fitur Aset Tetap');
    }
  });
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

function nextKode(prefix){
  DB.counters[prefix] = (DB.counters[prefix]||0)+1;
  return prefix + '-' + String(DB.counters[prefix]).padStart(3,'0');
}

/* ---------------- COA SEED ---------------- */
function addAkun(prefix, nama, kepemilikan, keterangan, extra){
  const akun = { id:uid(), kode:nextKode(prefix), kategori:prefix, nama, kepemilikan, keterangan: keterangan||'', ...(extra||{}) };
  DB.coa.push(akun);
  return akun;
}

function seedCOA(){
  DB.coa = []; DB.counters = {};

  // ---- Aset Lancar (kas/bank) ----
  const kasPribadi = ['Kas Tunai Ayu','Kas Tunai Reza','Bank BCA Ayu','Bank BCA Reza','Bank BNI Reza','Seabank Ayu','Shopeepay Ayu','Shopeepay Reza','Gopay Ayu'];
  kasPribadi.forEach(n=> addAkun('AL', n, 'Pribadi', 'Kas/bank harian'));
  ['Bisnis A','Bisnis B','Bisnis C'].forEach(b=>{
    addAkun('AL', 'Kas Tunai '+b, b, 'Kas operasional usaha');
    addAkun('AL', 'Bank '+b, b, 'Rekening operasional usaha');
  });

  // ---- Aset Persediaan ----
  const persediaanJenis = ['Persediaan Makanan Mentah','Persediaan Makanan Setengah Jadi','Persediaan Makanan Jadi'];
  KEPEMILIKAN.forEach(kep=>{
    persediaanJenis.forEach(n=> addAkun('PS', n, kep, 'Nilai persediaan menurut kartu stok, lokasi diatur di sheet Persediaan'));
  });

  // ---- Aset Lancar Lainnya ----
  const alLainnya = ['Sewa Dibayar Di Muka - Kontrakan','Sewa Dibayar Di Muka - Lainnya','Biaya Dibayar Di Muka - Aplikasi Pro Yearly','Biaya Dibayar Di Muka - Lainnya A','Biaya Dibayar Di Muka - Lainnya B','Biaya Dibayar Di Muka - Lainnya C'];
  KEPEMILIKAN.forEach(kep=>{ alLainnya.forEach(n=> addAkun('ALL', n, kep, 'Diamortisasi bertahap ke beban')); });

  // ---- Aset Lainnya (investasi) ----
  ['Investasi BCA Reza','Investasi BRI Reza','Investasi Valas - Yen','Investasi Valas - CHF','Investasi Valas - SGD','Investasi Valas - Lainnya A','Investasi Valas - Lainnya B','Investasi Valas - Lainnya C']

/* ---------------- JOURNAL ENGINE ---------------- */
// posts a balanced pair (debit account, credit account) for a given nominal
function postJurnal({tanggal, keterangan, debitId, kreditId, nominal, sumber, ref, tags}){
  if(!debitId || !kreditId || !nominal || Number(nominal)<=0) return null;
  const entry = { id:uid(), no: (DB.jurnal.length+1), tanggal: tanggal||todayStr(), keterangan: keterangan||'', debitId, kreditId, nominal:Number(nominal), sumber: sumber||'Jurnal Umum', ref: ref||'', tags: tags||[] };
  DB.jurnal.push(entry);
  return entry;
}
function deleteJurnalByRef(ref){ DB.jurnal = DB.jurnal.filter(j=>j.ref!==ref); }
function deleteJurnalEntry(id){ DB.jurnal = DB.jurnal.filter(j=>j.id!==id); }

/* ---- Tag helpers ---- */
function ensureTag(name){
  name = (name||'').trim();
  if(!name) return;
  if(!DB.tags.includes(name)) DB.tags.push(name);
}
function parseTagInput(str){
  return (str||'').split(',').map(s=>s.trim()).filter(Boolean);
}
function tagChipsHtml(tags){
  return (tags||[]).map(t=>`<span class="tag c" style="margin-right:3px">${t}</span>`).join('');
}
function tagDatalist(){
  return `<datalist id="tagList">${DB.tags.map(t=>`<option value="${t}">`).join('')}</datalist>`;
}

/* ---- Generic search filter helper ---- */
function matchSearch(text, term){
  if(!term) return true;
  return (text||'').toLowerCase().includes(term.toLowerCase());
}
function searchBoxHtml(id, placeholder){
  return `<input type="text" id="${id}" placeholder="🔍 ${placeholder||'Cari...'}" style="padding:8px 12px;border:1px solid var(--line);border-radius:9px;min-width:200px;font-size:13px">`;
}
/* Generic search input binder: re-rendering the table on every keystroke normally steals focus.
   This restores focus + cursor position right after the re-render so typing feels uninterrupted. */
function bindSearchInput(id, onInput){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', e=>{
    const pos = e.target.selectionStart;
    onInput(e.target.value);
    renderContent();
    const el2 = document.getElementById(id);
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(err){} }
  });
}

/* ---- Generic manageable master-list helpers ----
   Used for: kategori produk, satuan, jenis bahan, jenis resep, kategori langkah, kepemilikan.
   Each is a plain array on DB (e.g. DB.satuanCustom) that the user can add/remove from directly in the UI. */
function getAllKepemilikan(){ return [...KEPEMILIKAN, ...DB.kepemilikanCustom]; }
function ensureInList(listName, value){
  value = (value||'').trim(); if(!value) return;
  if(!DB[listName].includes(value)) DB[listName].push(value);
}
function removeFromList(listName, value){ DB[listName] = DB[listName].filter(v=>v!==value); }

/* Renders a <select> plus small manage buttons (+ add / − remove) next to it.
   options: array of strings, value: currently selected value, selectId: id for the <select>,
   listName: DB key backing the list (for add/remove), extraOnChange: optional inline onchange js not used (we bind via JS). */
function manageableSelectHtml(selectId, options, value, listName){
  return `<div style="display:flex;gap:3px;align-items:center">
    <select id="${selectId}" data-list="${listName}">${options.map(o=>`<option value="${o.replace(/"/g,'&quot;')}" ${o===value?'selected':''}>${o}</option>`).join('')}</select>
    <button type="button" class="btn small ghost btnMasterAdd" data-list="${listName}" data-target="${selectId}" title="Tambah opsi baru" style="padding:5px 7px">+</button>
    <button type="button" class="btn small ghost danger btnMasterDel" data-list="${listName}" data-target="${selectId}" title="Hapus opsi terpilih" style="padding:5px 7px">−</button>
  </div>`;
}
/* Call this once per rendered container to wire up all manageableSelectHtml() add/remove buttons. */
function bindMasterListButtons(container, onChange){
  container.querySelectorAll('.btnMasterAdd').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = prompt('Tambah opsi baru:'); if(!val) return;
      ensureInList(btn.dataset.list, val.trim());
      save();
      const sel = document.getElementById(btn.dataset.target);
      if(sel) sel.value = val.trim();
      if(onChange) onChange(btn.dataset.list, val.trim());
      renderContent();
    });
  });
  container.querySelectorAll('.btnMasterDel').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sel = document.getElementById(btn.dataset.target);
      const val = sel ? sel.value : '';
      if(!val) return toast('Pilih opsi yang mau dihapus dulu');
      if(!confirm('Hapus opsi "'+val+'" dari daftar master? (data yang sudah memakai nilai ini tidak ikut berubah)')) return;
      removeFromList(btn.dataset.list, val);
      save(); renderContent();
    });
  });
}

/* Ensures a persediaan (PS) / BPP account exists for a given kepemilikan, auto-creating it
   (for custom kepemilikan values added by the user beyond the default 4). */
function getOrCreateAkunForKepemilikan(kategori, kepemilikan, namaFallback){
  let akun = DB.coa.find(a=>a.kategori===kategori && a.kepemilikan===kepemilikan);
  if(!akun){
    const nama = kategori==='PS' ? 'Persediaan '+kepemilikan : kategori==='BPP' ? 'Beban Pokok '+kepemilikan : (namaFallback||kategori+' '+kepemilikan);
    akun = addAkun(kategori, nama, kepemilikan, 'Dibuat otomatis untuk kepemilikan kustom');
  }
  return akun;
}

function akunById(id){ return DB.coa.find(a=>a.id===id); }
function normalIsDebit(kategori){ return DEBIT_NORMAL.has(kategori); }

// running balance for one account, purely from jurnal
function saldoAkun(akunId){
  const akun = akunById(akunId);
  if(!akun) return 0;
  let debit=0, kredit=0;
  DB.jurnal.forEach(j=>{
    if(j.debitId===akunId) debit+=j.nominal;
    if(j.kreditId===akunId) kredit+=j.nominal;
  });
  return normalIsDebit(akun.kategori) ? (debit-kredit) : (kredit-debit);
}

function sumByKategoriKepemilikan(kategori, kepemilikan){
  return DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan))
    .reduce((s,a)=> s+saldoAkun(a.id), 0);
}

/* Laba/rugi bersih per kepemilikan (Pendapatan - BPP - BO - BL) */
function labaRugiPerKepemilikan(kep){
  const pd = sumByKategoriKepemilikan('PD', kep);
  const bpp = sumByKategoriKepemilikan('BPP', kep);
  const bo = sumByKategoriKepemilikan('BO', kep);
  const bl = sumByKategoriKepemilikan('BL', kep);
  return pd - bpp - bo - bl;
}

      <td class="wrap-cell"><input class="edit-nama" value="${a.nama.replace(/"/g,'&quot;')}"></td>

      <td class="wrap-cell"><input class="edit-ket" value="${(a.keterangan||'').replace(/"/g,'&quot;')}"></td>
      <td class="num">${fmtRp(saldoAkun(a.id))}</td>
      <td><button class="btn small danger btnDelAkun">Hapus</button></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  c.innerHTML = html;

  document.getElementById('coaFilter').addEventListener('change', e=>{ coaFilterKategori = e.target.value; renderContent(); });
  bindSearchInput('coaSearchInput', v=>{ coaSearch = v; });
  document.getElementById('btnAddAkun').addEventListener('click', ()=>{
    const kategori = prompt('Kode kategori:\nAL, PS, ALL, AT, KAT, ALN, KW, MD, PD, BPP, BO, BL', 'BO');
    if(!kategori || !KAT[kategori.toUpperCase()]) return toast('Kategori tidak valid');
    const nama = prompt('Nama akun baru:'); if(!nama) return;
    if(DB.coa.some(a=> a.nama.trim().toLowerCase()===nama.trim().toLowerCase())) return toast('Nama akun ini sudah ada — pakai nama lain supaya tidak salah akun');
    const kep = prompt('Kepemilikan (Pribadi/Bisnis A/Bisnis B/Bisnis C):','Pribadi');
    addAkun(kategori.toUpperCase(), nama, KEPEMILIKAN.includes(kep)?kep:'Pribadi', '');

  });
  c.querySelectorAll('tr[data-id]').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.edit-nama').addEventListener('change', e=>{
      const nama = e.target.value.trim();
      if(DB.coa.some(a=> a.id!==id && a.nama.trim().toLowerCase()===nama.toLowerCase())){
        toast('Nama akun ini sudah dipakai akun lain');
        e.target.value = akunById(id).nama;
        return;
      }
      akunById(id).nama = nama; save();
    });
    row.querySelector('.edit-kep').addEventListener('change', e=>{ akunById(id).kepemilikan=e.target.value; save(); renderContent(); });
    row.querySelector('.edit-ket').addEventListener('change', e=>{ akunById(id).keterangan=e.target.value; save(); });
    row.querySelector('.btnDelAkun').addEventListener('click', ()=>{
      if(DB.jurnal.some(j=>j.debitId===id||j.kreditId===id)) return toast('Tidak bisa hapus — akun sudah dipakai transaksi');
      if(!confirm('Hapus akun ini?')) return;
      DB.coa = DB.coa.filter(a=>a.id!==id); save(); renderContent();
    });
  });
};

/* ---------------- RESEP: cost & time roll-up ---------------- */
function getResepPorsi(r){ return (r.jumlahPorsi && r.jumlahPorsi>0) ? r.jumlahPorsi : 1; }

function getTotalWaktuResep(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = (r.steps||[]).reduce((s,st)=> s+(Number(st.waktuMenit)||0), 0);
  (r.bahan||[]).forEach(b=>{ if(b.tipe==='resep') total += getTotalWaktuResep(b.refId, visited); });
  return total;
}

function computeResepTotalHarga(resepId, visited){
  visited = visited || new Set();
  if(visited.has(resepId)) return 0;
  visited.add(resepId);
  const r = DB.resep.find(x=>x.id===resepId);
  if(!r) return 0;
  let total = 0;
  (r.bahan||[]).forEach(b=>{
    if(b.tipe==='produk'){
      const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;
      total += (Number(b.qty)||0) * (prod.hargaBeliPerSatuan||0);
    } else if(b.tipe==='resep'){
      const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;
      const subTotal = computeResepTotalHarga(b.refId, visited);
      total += (Number(b.qty)||0) * (subTotal / getResepPorsi(sub));
    }
  });
  return total;
}

  AKUN_PICKER_FILTERS[id] = filterFn || null;
  const initialAkun = initialValue ? akunById(initialValue) : null;
  return `<div class="akunPicker" style="position:relative">
    <input type="text" id="${id}_q" class="akunPickerInput" placeholder="${placeholder||'Ketik nama akun...'}" autocomplete="off" value="${initialAkun?initialAkun.nama.replace(/"/g,'&quot;'):''}">
    <input type="hidden" id="${id}" value="${initialValue||''}">
    <div class="akunPickerList" id="${id}_list"></div>
  </div>`;
}
function bindAkunPicker(id, onSelect){
  if(onSelect) AKUN_PICKER_ONSELECT[id] = onSelect;
  const q = document.getElementById(id+'_q');
  const hidden = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!q || !hidden || !list) return;
  const filterFn = AKUN_PICKER_FILTERS[id];
  function renderList(term){
    const opts = sortAkunList(DB.coa.filter(a=> !filterFn || filterFn(a)).filter(a=> matchSearch(a.nama+' '+a.kode+' '+a.kepemilikan, term)));
    let itemsHtml = opts.slice(0,50).map(a=>`<div class="akunPickerItem" data-id="${a.id}"><b>${a.nama}</b><span class="mini"> — ${a.kepemilikan} · ${KAT[a.kategori]}</span></div>`).join('');
    if(!itemsHtml) itemsHtml = '<div class="akunPickerItem mini">Tidak ditemukan, coba kata kunci lain</div>';
    const exactMatch = term && DB.coa.some(a=> a.nama.toLowerCase()===term.trim().toLowerCase());
    if(term && term.trim() && !exactMatch){
      itemsHtml += `<div class="akunPickerItem akunPickerAddNew" data-newname="${term.trim().replace(/"/g,'&quot;')}" style="color:var(--terracotta-dark);font-weight:700">+ Tambah akun baru: "${term.trim()}"</div>`;
    }
    list.innerHTML = itemsHtml;
    list.style.display = 'block';
  }
  q.addEventListener('focus', ()=> renderList(q.value));
  q.addEventListener('input', ()=>{ hidden.value=''; renderList(q.value); });
  q.addEventListener('blur', ()=> setTimeout(()=>{ list.style.display='none'; }, 180));
  list.addEventListener('mousedown', e=>{
    const addItem = e.target.closest('.akunPickerAddNew');
    if(addItem){
      const namaBaru = addItem.dataset.newname;
      const katList = KATEGORI_ORDER.map((k,i)=>`${i+1}. ${KAT[k]}`).join('\n');
      const katIdx = prompt('Kategori neraca untuk akun "'+namaBaru+'":\n'+katList); if(!katIdx) return;
      const kategori = KATEGORI_ORDER[Number(katIdx)-1]; if(!kategori) return toast('Nomor tidak valid');
      const kepList = getAllKepemilikan().map((k,i)=>`${i+1}. ${k}`).join('\n');
      const kepIdx = prompt('Kepemilikan:\n'+kepList, '1'); if(!kepIdx) return;
      const kepemilikan = getAllKepemilikan()[Number(kepIdx)-1]; if(!kepemilikan) return toast('Nomor tidak valid');
      if(DB.coa.some(a=> a.nama.toLowerCase()===namaBaru.toLowerCase())) return toast('Nama akun ini sudah ada, pilih dari daftar');
      const akun = addAkun(kategori, namaBaru, kepemilikan, '');
      save();
      hidden.value = akun.id; q.value = akun.nama; list.style.display='none';
      if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
      toast('Akun baru dibuat: '+akun.nama);
      return;
    }
    const item = e.target.closest('.akunPickerItem'); if(!item || !item.dataset.id) return;
    const akun = akunById(item.dataset.id);
    hidden.value = akun.id;
    q.value = akun.nama;
    list.style.display = 'none';
    if(AKUN_PICKER_ONSELECT[id]) AKUN_PICKER_ONSELECT[id](akun.id);
  });
}
/* Call once after rendering a form containing one or more akunPickerHtml() fields. */
function bindAllAkunPickers(container){
  container.querySelectorAll('.akunPicker').forEach(wrap=>{
    const hidden = wrap.querySelector('input[type=hidden]');
    if(hidden) bindAkunPicker(hidden.id);
  });
}

  let html = `<div class="card">
    <div class="formgrid">
      <div class="field"><label>Tanggal</label><input type="date" id="fTgl" value="${todayStr()}"></div>

  <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Akun Kas/Bank</th><th>Akun Lawan</th><th>Nominal</th><th>Tag</th><th></th></tr></thead><tbody>
  ${[...DB.jurnal].filter(j=>j.sumber===opts.sumber).filter(j=>{
    const kasAkun = opts.debitIsKas?akunById(j.debitId):akunById(j.kreditId);
    const lawanAkun = opts.debitIsKas?akunById(j.kreditId):akunById(j.debitId);
    return matchSearch(j.keterangan+' '+(kasAkun?.nama||'')+' '+(lawanAkun?.nama||''), term);
  }).reverse().map(j=>{
    const kasAkun = opts.debitIsKas?akunById(j.debitId):akunById(j.kreditId);
    const lawanAkun = opts.debitIsKas?akunById(j.kreditId):akunById(j.debitId);
    return `<tr><td>${j.tanggal}</td><td>${j.keterangan||'-'}</td><td>${kasAkun?.nama||'?'}</td><td>${lawanAkun?.nama||'?'}</td><td class="num">${fmtRp(j.nominal)}</td><td>${tagChipsHtml(j.tags)}</td><td><button class="btn small editJ" data-jid="${j.id}">Edit</button> <button class="btn small danger delJ" data-jid="${j.id}">Hapus</button></td></tr>`;
  }).join('') || `<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>`}
  </tbody></table></div></div>`;
  c.innerHTML = html;
  bindAllAkunPickers(c);
  bindSearchInput('cashSearchInput', v=>{ cashFormSearch[searchKey]=v; });
  document.getElementById('btnPostSimple').addEventListener('click', ()=>{
    const kasId=fKas.value, lawanId=fLawan.value, nominal=Number(fNom.value);
    if(!kasId||!lawanId) return toast('Lengkapi akun');
    if(!nominal||nominal<=0) return toast('Isi nominal');
    const debitId = opts.debitIsKas?kasId:lawanId;
    const kreditId = opts.debitIsKas?lawanId:kasId;
    const tags = parseTagInput(fTagInput.value); tags.forEach(ensureTag);
    postJurnal({tanggal:fTgl.value, keterangan:fKet.value, debitId, kreditId, nominal, sumber:opts.sumber, tags});
    save(); renderContent(); toast('Tersimpan');
  });
  bindJurnalRowActions(c);
}

  </tbody></table></div></div>`;
  c.innerHTML = html;
  bindAllAkunPickers(c);

  bindSearchInput('pembelianSearchInput', v=>{ pembelianSearch=v; });
  document.getElementById('btnAddProdukInline').addEventListener('click', ()=>{
    const nama = prompt('Nama produk baru:'); if(!nama) return;
    const satuan = (prompt('Satuan:', DB.satuanCustom[0]||'pcs')||DB.satuanCustom[0]||'pcs').trim();
    ensureInList('satuanCustom', satuan);
    const kategori = DB.kategoriProdukCustom[0]||'Bahan Mentah';
    DB.produk.push({ id:uid(), kode:nextKode(prefixKategoriProduk(kategori)), nama, kategori, satuan, kepemilikan:'Pribadi', jenisBahan:'', gambar:null, runQty:0, runTotal:0, hargaBeliPerSatuan:0, hargaJual:0, stok:0, hampirHabis:false, lokasi:'' });
    save(); renderContent(); toast('Produk baru ditambahkan, silakan pilih di dropdown');
  });

  document.getElementById('btnPostPembelian').addEventListener('click', ()=>{
    const bayarId=pBayar.value, produkId=pProduk.value, qty=Number(pQty.value), total=Number(pTotal.value);
    if(!bayarId||!produkId) return toast('Lengkapi akun & produk');
    if(!qty||qty<=0||!total||total<=0) return toast('Isi qty & total harga');
    const prod = DB.produk.find(x=>x.id===produkId);
    prod.runQty = (prod.runQty||0) + qty;
    prod.runTotal = (prod.runTotal||0) + total;
    prod.hargaBeliPerSatuan = prod.runQty>0 ? (prod.runTotal/prod.runQty) : 0;
    prod.stok = (prod.stok||0) + qty;

    const tags = parseTagInput(pTag.value); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal:pTgl.value, bayarId, produkId, qty, total, keterangan:pKet.value, tags };
    DB.pembelian.push(pObj);

    const persediaanAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===prod.kepemilikan) || DB.coa.find(a=>a.kategori==='PS');
    postJurnal({ tanggal:pTgl.value, keterangan:'Pembelian '+prod.nama+' x'+qty+(pKet.value?' ('+pKet.value+')':''), debitId:persediaanAkun.id, kreditId:bayarId, nominal:total, sumber:'Pembelian', ref:'pembelian-'+pObj.id, tags });

    const bulan = pTgl.value.slice(0,7);
    const bud = DB.budgeting.find(x=> x.produkId===produkId && x.tanggal.slice(0,7)===bulan);
    if(bud){ bud.realisasi = (bud.realisasi||0) + total; }

    save(); renderContent(); toast('Pembelian tersimpan, persediaan & kas terupdate');
  });
  c.querySelectorAll('.btnDelPembelian').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus pembelian ini? Stok & jurnal terkait tidak otomatis dikoreksi — sesuaikan manual jika perlu.')) return;
    DB.pembelian = DB.pembelian.filter(x=>x.id!==btn.dataset.id);
    deleteJurnalByRef('pembelian-'+btn.dataset.id);
    save(); renderContent();
  }));
};

/* ================= PENJUALAN (dengan harga) ================= */
let penjualanSearch = '';
RENDERERS.penjualan = function(c){
  let html = `<div class="card">
    <div class="mini" style="margin-bottom:10px">Untuk penjualan sungguhan dengan nilai Rp — otomatis mencatat pendapatan sekaligus memindahkan bahan dari persediaan ke beban pokok.</div>
    <div class="formgrid">
      <div class="field"><label>Tanggal</label><input type="date" id="jlTgl" value="${todayStr()}"></div>
      <div class="field"><label>Menu (dari Resep)</label><select id="jlResep"><option value="">— pilih menu —</option>${DB.resep.map(r=>`<option value="${r.id}">${r.namaMenu}</option>`).join('')}</select></div>
      <div class="field"><label>Qty porsi terjual</label><input type="number" id="jlQty" placeholder="0"></div>
      <div class="field"><label>Total Harga Jual (Rp)</label><input type="number" id="jlHarga" placeholder="0"></div>
    </div>
    <div class="formgrid">
      <div class="field" style="grid-column:span 2"><label>Diterima ke akun</label>${akunPickerHtml('jlAkun', a=>['AL','ALL'].includes(a.kategori), 'Ketik nama akun...')}</div>
      ${tagInputHtml('jlTag')}
    </div>
    <button class="btn primary" id="btnPostPenjualan">Simpan Penjualan</button>
  </div>

  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Riwayat Penjualan (${DB.penjualan.length})</h3>${searchBoxHtml('penjualanSearchInput','Cari menu')}</div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Menu</th><th>Qty</th><th>Harga Jual</th><th>HPP</th><th>Tag</th><th></th></tr></thead><tbody>
  ${[...DB.penjualan].filter(p=>{ const r=DB.resep.find(x=>x.id===p.resepId); return matchSearch(r?r.namaMenu:'', penjualanSearch); }).reverse().map(p=>{
    const r = DB.resep.find(x=>x.id===p.resepId);
    return `<tr><td>${p.tanggal}</td><td>${r?r.namaMenu:'(resep dihapus)'}</td><td class="num">${fmtNum(p.qty)}</td><td class="num">${fmtRp(p.harga)}</td><td class="num">${fmtRp(p.nilaiBahan)}</td><td>${tagChipsHtml(p.tags)}</td><td><button class="btn small danger btnDelPenjualan" data-id="${p.id}">Hapus</button></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">Belum ada penjualan</td></tr>'}
  </tbody></table></div></div>`;
  c.innerHTML = html;
  bindAllAkunPickers(c);

  bindSearchInput('penjualanSearchInput', v=>{ penjualanSearch=v; });
  document.getElementById('btnPostPenjualan').addEventListener('click', ()=>{
    const resepId=jlResep.value, qty=Number(jlQty.value), harga=Number(jlHarga.value), akunId=jlAkun.value;
    if(!resepId||!akunId) return toast('Lengkapi menu & akun penerima');
    if(!qty||qty<=0) return toast('Isi qty');
    const resep = DB.resep.find(x=>x.id===resepId);
    if(!resep || (resep.bahan||[]).length===0) return toast('Resep ini belum punya bahan');

    const consumed = [];
    let nilaiBahan=0, kep='Pribadi';
    (function consumeBahan(list, mult){
      list.forEach(b=>{
        if(b.tipe==='produk'){
          const prod = DB.produk.find(x=>x.id===b.refId); if(!prod) return;
          const pakai = b.qty*qty*mult;
          consumed.push({prod, pakai});
        } else if(b.tipe==='resep'){
          const sub = DB.resep.find(x=>x.id===b.refId); if(!sub) return;
          consumeBahan(sub.bahan||[], b.qty*mult);
        }
      });
    })(resep.bahan, 1);

    consumed.forEach(({prod,pakai})=>{
      prod.stok = (prod.stok||0) - pakai;
      nilaiBahan += pakai*(prod.hargaBeliPerSatuan||0);
      kep = prod.kepemilikan;
    });

    const tags = parseTagInput(jlTag.value); tags.forEach(ensureTag);
    const pObj = { id:uid(), tanggal:jlTgl.value, resepId, qty, harga, nilaiBahan:Math.round(nilaiBahan), akunId, tags };
    DB.penjualan.push(pObj);

    const pdAkun = DB.coa.find(a=>a.kategori==='PD' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PD');
    postJurnal({ tanggal:jlTgl.value, keterangan:'Penjualan '+resep.namaMenu+' x'+qty, debitId:akunId, kreditId:pdAkun.id, nominal:harga||1, sumber:'Penjualan', ref:'penjualan-pd-'+pObj.id, tags });
    if(nilaiBahan>0){
      const bppAkun = DB.coa.find(a=>a.kategori==='BPP' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='BPP');
      const psAkun = DB.coa.find(a=>a.kategori==='PS' && a.kepemilikan===kep) || DB.coa.find(a=>a.kategori==='PS');
      postJurnal({ tanggal:jlTgl.value, keterangan:'HPP '+resep.namaMenu+' x'+qty, debitId:bppAkun.id, kreditId:psAkun.id, nominal:Math.round(nilaiBahan), sumber:'Penjualan', ref:'penjualan-hpp-'+pObj.id, tags });
    }
    save(); renderContent(); toast('Penjualan tersimpan');
  });
  c.querySelectorAll('.btnDelPenjualan').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Hapus penjualan ini?')) return;
    DB.penjualan = DB.penjualan.filter(x=>x.id!==btn.dataset.id);
    deleteJurnalByRef('penjualan-pd-'+btn.dataset.id); deleteJurnalByRef('penjualan-hpp-'+btn.dataset.id);
    save(); renderContent();
  }));
};

let budgetingSubtab = 'anggaran';

function renderAnggaranBahan(c){
  let html = `<div class="card">
    <div class="formgrid">
      <div class="field"><label>Bulan</label><input type="month" id="udBulan" value="${todayStr().slice(0,7)}"></div>
      <div class="field" style="grid-column:span 2"><label>Bahan</label><select id="udProduk"><option value="">— pilih produk —</option>${DB.produk.map(p=>`<option value="${p.id}">${p.nama}</option>`).join('')}</select></div>
      <div class="field"><label>Budget (Rp)</label><input type="number" id="udBudget" placeholder="0"></div>
    </div>
    <button class="btn primary" id="btnAddBudget">Tambah Anggaran</button>
  </div>
  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Anggaran vs Realisasi</h3></div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>Bulan</th><th>Bahan</th><th>Budget</th><th>Realisasi</th><th>Selisih</th><th>%</th><th></th></tr></thead><tbody>`;
  [...DB.budgeting].reverse().forEach(b=>{
    const prod = DB.produk.find(p=>p.id===b.produkId);
    const selisih = (b.budget||0) - (b.realisasi||0);
    const pct = b.budget? Math.round((b.realisasi||0)/b.budget*100) : 0;
    html += `<tr data-id="${b.id}"><td>${b.tanggal.slice(0,7)}</td><td>${prod?prod.nama:'(dihapus)'}</td><td class="num">${fmtRp(b.budget)}</td><td class="num">${fmtRp(b.realisasi||0)}</td><td class="num" style="color:${selisih<0?'var(--kredit)':'var(--debit)'}">${fmtRp(selisih)}</td><td class="num">${pct}%</td><td><button class="btn small danger btnDelBud">Hapus</button></td></tr>`;
  });
  if(DB.budgeting.length===0) html += `<tr><td colspan="7" class="empty">Belum ada anggaran</td></tr>`;

/* ---- Smart daily menu recommendation, based on current stock (recalculated live every render) ---- */
const MENU_KATEGORI_PRIORITAS = ['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Buah Vitamin','Air Putih Mineral','Snack'];
const MEAL_SLOTS = [
  {nama:'Pagi', kategori:['Nasi Karbohidrat','Lauk Protein','Air Putih Mineral']},
  {nama:'Siang', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
  {nama:'Sore', kategori:['Snack','Buah Vitamin']},
  {nama:'Malam', kategori:['Nasi Karbohidrat','Lauk Protein','Sayur Serat','Air Putih Mineral']},
];
function matchResepKategoriBudget(r){
  const j = (r.jenisResep||'').toLowerCase();
  if(j.includes('protein')||j.includes('lauk')) return 'Lauk Protein';
  if(j.includes('karbohidrat')||j.includes('nasi')) return 'Nasi Karbohidrat';
  if(j.includes('sayur')) return 'Sayur Serat';
  if(j.includes('buah')) return 'Buah Vitamin';
  if(j.includes('air')||j.includes('minuman')||j.includes('minum')) return 'Air Putih Mineral';
  if(j.includes('snack')||j.includes('camilan')) return 'Snack';
  return null;
}
function resepStockScore(r){
  return (r.bahan||[]).filter(b=>b.tipe==='produk').reduce((s,b)=>{
    const p = DB.produk.find(x=>x.id===b.refId);
    return s + (p ? (p.stok||0) : 0);
  }, 0);
}
/* Deterministic-but-varied pick: ranks candidates by remaining stock (use up abundant stock first),
   then rotates among the top few based on the date so consecutive days don't repeat the same thing. */
function getRekomendasiHarian(dateStr){
  const dayNum = Number(dateStr.slice(8,10)) || 1;
  return MEAL_SLOTS.map((slot, slotIdx)=>{
    const menus = slot.kategori.map((kat, katIdx)=>{
      const kandidat = DB.resep.filter(r=> matchResepKategoriBudget(r)===kat);
      if(kandidat.length===0) return { kategori:kat, resep:null };
      const scored = kandidat.map(r=>({r, score:resepStockScore(r)})).sort((a,b)=> b.score-a.score);
      const top = scored.slice(0, Math.min(3, scored.length));
      const pick = top[(dayNum + slotIdx + katIdx) % top.length].r;
      return { kategori:kat, resep:pick };
    }).filter(m=>m.resep);
    return { slot: slot.nama, menus };
  });
}

/* ================= LABA RUGI (dengan filter tanggal & tag) ================= */
let lrFilter = { mode:'bulan_ini', dari:'', sampai:'', tag:'' };
function dateRangeForMode(mode){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=> d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(mode==='hari_ini'){ return [fmt(now), fmt(now)]; }
  if(mode==='minggu_ini'){ const start=new Date(now); start.setDate(now.getDate()-now.getDay()); return [fmt(start), fmt(now)]; }
  if(mode==='bulan_ini'){ return [fmt(new Date(now.getFullYear(),now.getMonth(),1)), fmt(now)]; }
  if(mode==='bulan_lalu'){ const s=new Date(now.getFullYear(),now.getMonth()-1,1), e=new Date(now.getFullYear(),now.getMonth(),0); return [fmt(s), fmt(e)]; }
  if(mode==='tahun_ini'){ return [fmt(new Date(now.getFullYear(),0,1)), fmt(now)]; }
  if(mode==='tahun_lalu'){ return [fmt(new Date(now.getFullYear()-1,0,1)), fmt(new Date(now.getFullYear()-1,11,31))]; }
  return [lrFilter.dari, lrFilter.sampai];
}
function filteredJurnal(){
  let [dari, sampai] = lrFilter.mode==='custom' ? [lrFilter.dari, lrFilter.sampai] : dateRangeForMode(lrFilter.mode);
  return DB.jurnal.filter(j=>{
    if(dari && j.tanggal<dari) return false;
    if(sampai && j.tanggal>sampai) return false;
    if(lrFilter.tag && !(j.tags||[]).includes(lrFilter.tag)) return false;
    return true;
  });
}
function sumByKategoriKepemilikanFiltered(kategori, kepemilikan, jlist){
  const akunIds = new Set(DB.coa.filter(a=>a.kategori===kategori && (!kepemilikan||a.kepemilikan===kepemilikan)).map(a=>a.id));
  let debit=0, kredit=0;
  jlist.forEach(j=>{ if(akunIds.has(j.debitId)) debit+=j.nominal; if(akunIds.has(j.kreditId)) kredit+=j.nominal; });
  const isDebitNormal = DEBIT_NORMAL.has(kategori);
  return isDebitNormal ? debit-kredit : kredit-debit;
}

    groups[kelompok] += arah*j.nominal;
    rows.push({...j, arah, kelompok, lawanNama: lawan?lawan.nama:'?'});
  });
  const totalKas = groups.Operasional+groups.Investasi+groups.Pendanaan;
  let html = `<div class="grid cols-3">
    <div class="card kpi"><div class="label">Aktivitas Operasional</div><div class="value ${groups.Operasional>=0?'pos':'neg'}">${fmtRp(groups.Operasional)}</div></div>

    <div class="card kpi"><div class="label">Aktivitas Pendanaan</div><div class="value ${groups.Pendanaan>=0?'pos':'neg'}">${fmtRp(groups.Pendanaan)}</div></div>
  </div>
  <div class="card kpi" style="margin-top:14px;max-width:320px"><div class="label">Kenaikan (Penurunan) Kas Bersih</div><div class="value ${totalKas>=0?'pos':'neg'}">${fmtRp(totalKas)}</div></div>

  ${rows.length? [...rows].reverse().map(r=>`<tr><td>${r.tanggal}</td><td>${r.keterangan||'-'}</td><td>${r.kelompok}</td><td>${r.lawanNama}</td><td>${r.arah>0?'Masuk':'Keluar'}</td><td class="num" style="color:${r.arah>0?'var(--debit)':'var(--kredit)'}">${fmtRp(r.arah*r.nominal)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pergerakan kas</td></tr>'}

};

  bindSearchInput('bbSearch', v=>{ bukuBesarSearch=v; renderBukuBesarResult(); });
  renderBukuBesarResult();

function renderBukuBesarResult(){
  const wrap = document.getElementById('bbResult'); if(!wrap) return;
  if(!bukuBesarAkun){ wrap.innerHTML = '<div class="empty">Pilih akun untuk melihat buku besarnya</div>'; return; }
  const akun = akunById(bukuBesarAkun);
  const isDebitNormal = normalIsDebit(akun.kategori);
  let running = 0;
  const rows = DB.jurnal.filter(j=> (j.debitId===akun.id||j.kreditId===akun.id) && matchSearch(j.keterangan, bukuBesarSearch));
  let html = `<div class="card">
    <div class="section-title"><h3>${akun.nama} <span class="mini">(${KAT[akun.kategori]} — ${akun.kepemilikan})</span></h3><span class="hint">Saldo saat ini: <b>${fmtRp(saldoAkun(akun.id))}</b></span></div>

  rows.forEach(j=>{
    const isDebit = j.debitId===akun.id;
    const delta = isDebit? (isDebitNormal?j.nominal:-j.nominal) : (isDebitNormal?-j.nominal:j.nominal);
    running += delta;
    html += `<tr><td>${j.tanggal}</td><td>${j.keterangan||'-'}</td><td class="num">${isDebit?fmtRp(j.nominal):''}</td><td class="num">${!isDebit?fmtRp(j.nominal):''}</td><td class="num">${fmtRp(running)}</td><td>${tagChipsHtml(j.tags)}</td><td><button class="btn small editJ" data-jid="${j.id}">Edit</button> <button class="btn small danger delJ" data-jid="${j.id}">Hapus</button></td></tr>`;
  });
  if(rows.length===0) html += `<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>`;
  html += `</tbody></table></div></div>`;
  wrap.innerHTML = html;
  bindJurnalRowActions(wrap);
}

/* ================= ASET TETAP ================= */
let asetSearch = '';
function hitungDepresiasiBulanan(a){
  if(!a.masaManfaatBulan || a.masaManfaatBulan<=0) return 0;
  const dasar = (a.biayaAkuisisi||0) - (a.nilaiResidu||0);
  return Math.round(dasar / a.masaManfaatBulan);
}
function akumulasiPenyusutanAset(a){
  return DB.jurnal.filter(j=>j.ref==='aset-dep-'+a.id).reduce((s,j)=>s+j.nominal,0);
}
RENDERERS.aset = function(c){
  const filtered = DB.aset.filter(a=> matchSearch(a.nama+' '+a.noAset+' '+a.jenis, asetSearch));
  let html = `<div class="card">
    <div class="section-title"><h3>Tambah Aset Baru</h3></div>
    <div class="formgrid">
      <div class="field"><label>Nama Aset</label><input id="asNama" placeholder="mis. Motor Beat 2023"></div>

      <div class="field"><label>Biaya Akuisisi (Rp)</label><input type="number" id="asBiaya" placeholder="0"></div>
    </div>
    <div class="formgrid">
      <div class="field"><label>Nilai Residu (Rp, opsional)</label><input type="number" id="asResidu" placeholder="0"></div>
      <div class="field"><label>Masa Manfaat (bulan)</label><input type="number" id="asMasa" placeholder="mis. 48"></div>
      <div class="field" style="grid-column:span 2"><label>Akun yang Dikreditkan (sumber dana)</label>${akunPickerHtml('asAkunKredit', a=>['AL','KW'].includes(a.kategori), 'Ketik nama akun...')}</div>
    </div>
    <div class="formgrid">
      <div class="field" style="grid-column:span 2"><label>Akun Aset Tetap (COA)</label>${akunPickerHtml('asAkunAset', a=>a.kategori==='AT', 'Ketik nama akun aset tetap...')}</div>
      <div class="field" style="grid-column:span 2"><label>Akun Akumulasi Penyusutan (kontra, opsional)</label>${akunPickerHtml('asAkunAkum', a=>a.kategori==='KAT', 'Ketik nama akun akumulasi penyusutan...')}</div>
    </div>
    <button class="btn primary" id="btnAddAset">Simpan Aset</button>
    <datalist id="jenisAsetList">${DB.jenisAsetCustom.map(j=>`<option value="${j}">`).join('')}</datalist>
  </div>

  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Daftar Aset (${DB.aset.length})</h3>${searchBoxHtml('asetSearchInput','Cari nama/no aset/jenis')}</div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>No Aset</th><th>Nama</th><th>Jenis</th><th>Tanggal</th><th>Biaya Akuisisi</th><th>Penyusutan/bln</th><th>Akum. Penyusutan</th><th>Nilai Buku</th><th>Status</th><th></th></tr></thead><tbody>
  ${filtered.map(a=>{
    const dep = hitungDepresiasiBulanan(a);
    const akum = akumulasiPenyusutanAset(a);
    const nilaiBuku = (a.biayaAkuisisi||0) - akum;
    return `<tr data-id="${a.id}">
      <td class="mini">${a.noAset}</td><td>${a.nama}</td><td><span class="mini">${a.jenis}</span></td><td>${a.tanggalPerolehan}</td>
      <td class="num">${fmtRp(a.biayaAkuisisi)}</td><td class="num">${fmtRp(dep)}</td><td class="num">${fmtRp(akum)}</td><td class="num">${fmtRp(nilaiBuku)}</td>
      <td>${a.statusAktif===false?'<span class="tag kredit">Dilepas</span>':'<span class="tag debit">Aktif</span>'}</td>
      <td style="display:flex;gap:4px;flex-wrap:wrap">
        ${a.statusAktif!==false && a.akunAkumulasiId ? `<button class="btn small btnPostDep">Posting Penyusutan</button>`:''}
        ${a.statusAktif!==false ? `<button class="btn small danger btnLepasAset">Lepas Aset</button>`:''}
        <button class="btn small danger btnDelAset">Hapus</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="empty">Belum ada aset tercatat</td></tr>'}
  </tbody></table></div></div>`;
  c.innerHTML = html;
  bindAllAkunPickers(c);

  bindSearchInput('asetSearchInput', v=>{ asetSearch=v; });
  document.getElementById('btnAddAset').addEventListener('click', ()=>{
    const nama=asNama.value, jenis=asJenis.value, tgl=asTgl.value, biaya=Number(asBiaya.value), residu=Number(asResidu.value)||0, masa=Number(asMasa.value)||0;
    const akunKreditId=asAkunKredit.value, akunAsetId=asAkunAset.value, akunAkumId=asAkunAkum.value;
    if(!nama||!jenis||!biaya||!akunKreditId||!akunAsetId) return toast('Lengkapi data wajib (nama, jenis, biaya, akun kredit, akun aset)');
    if(jenis) { if(!DB.jenisAsetCustom.includes(jenis)) DB.jenisAsetCustom.push(jenis); }
    const noAset = nextKode('AST');
    const asetObj = { id:uid(), noAset, nama, jenis, tanggalPerolehan:tgl, biayaAkuisisi:biaya, nilaiResidu:residu, masaManfaatBulan:masa, akunKreditId, akunAsetId, akunAkumulasiId:akunAkumId||null, statusAktif:true };
    DB.aset.push(asetObj);
    postJurnal({ tanggal:tgl, keterangan:'Perolehan aset: '+nama+' ('+noAset+')', debitId:akunAsetId, kreditId:akunKreditId, nominal:biaya, sumber:'Aset', ref:'aset-perolehan-'+asetObj.id });
    save(); renderContent(); toast('Aset tersimpan, nomor: '+noAset);
  });

  c.querySelectorAll('tr[data-id]').forEach(row=>{
    const a = DB.aset.find(x=>x.id===row.dataset.id);
    const btnDep = row.querySelector('.btnPostDep');
    if(btnDep) btnDep.addEventListener('click', ()=>{
      const dep = hitungDepresiasiBulanan(a);
      if(dep<=0) return toast('Masa manfaat/biaya belum lengkap');
      const bebanAkun = DB.coa.find(x=>x.kategori==='BO' && x.kepemilikan===akunById(a.akunAsetId).kepemilikan && x.nama==='Beban Penyusutan Aset');
      postJurnal({ tanggal:todayStr(), keterangan:'Penyusutan '+a.nama+' ('+a.noAset+')', debitId:bebanAkun.id, kreditId:a.akunAkumulasiId, nominal:dep, sumber:'Aset', ref:'aset-dep-'+a.id });
      save(); renderContent(); toast('Penyusutan bulan ini diposting');
    });
    const btnLepas = row.querySelector('.btnLepasAset');
    if(btnLepas) btnLepas.addEventListener('click', ()=>{
      const hargaLepas = Number(prompt('Nilai pelepasan/penjualan aset ini (Rp, isi 0 jika dihapuskan/rusak):','0'))||0;
      const akum = akumulasiPenyusutanAset(a);
      const nilaiBuku = (a.biayaAkuisisi||0) - akum;
      const selisih = hargaLepas - nilaiBuku;
      const akunTerima = akum>0 ? prompt('Akun penerima dana pelepasan (nama akun kas/bank):', '') : null;
      let akunTerimaId = null;
      if(hargaLepas>0){
        const found = DB.coa.find(x=>x.kategori==='AL' && x.nama.toLowerCase().includes((akunTerima||'').toLowerCase()));
        akunTerimaId = found ? found.id : DB.coa.find(x=>x.kategori==='AL').id;
      }
      // reverse the asset & accumulated depreciation, recognize gain/loss
      if(a.akunAkumulasiId && akum>0){
        postJurnal({ tanggal:todayStr(), keterangan:'Hapus akumulasi penyusutan saat pelepasan: '+a.nama, debitId:a.akunAkumulasiId, kreditId:a.akunAsetId, nominal:akum, sumber:'Aset', ref:'aset-lepas-akum-'+a.id });
      }
      if(hargaLepas>0 && akunTerimaId){
        postJurnal({ tanggal:todayStr(), keterangan:'Penerimaan dari pelepasan aset: '+a.nama, debitId:akunTerimaId, kreditId:a.akunAsetId, nominal:hargaLepas, sumber:'Aset', ref:'aset-lepas-terima-'+a.id });
      }
      const sisaNilaiBuku = nilaiBuku - (hargaLepas>0?0:0);
      if(nilaiBuku-hargaLepas !== 0){
        const kep = akunById(a.akunAsetId).kepemilikan;
        const blAkun = DB.coa.find(x=>x.kategori==='BL' && x.kepemilikan===kep) || DB.coa.find(x=>x.kategori==='BL');
        const pdAkun = DB.coa.find(x=>x.kategori==='PD' && x.kepemilikan===kep) || DB.coa.find(x=>x.kategori==='PD');
        const diff = nilaiBuku - hargaLepas; // positive = loss, negative = gain
        if(diff>0){
          postJurnal({ tanggal:todayStr(), keterangan:'Rugi pelepasan aset: '+a.nama, debitId:blAkun.id, kreditId:a.akunAsetId, nominal:diff, sumber:'Aset', ref:'aset-lepas-rugi-'+a.id });
        } else if(diff<0){
          postJurnal({ tanggal:todayStr(), keterangan:'Laba pelepasan aset: '+a.nama, debitId:a.akunAsetId, kreditId:pdAkun.id, nominal:-diff, sumber:'Aset', ref:'aset-lepas-laba-'+a.id });
        }
      }
      a.statusAktif = false; a.tanggalLepas = todayStr(); a.hargaLepas = hargaLepas;
      save(); renderContent(); toast('Aset dilepas dan jurnal penyesuaian diposting');
    });
    row.querySelector('.btnDelAset').addEventListener('click', ()=>{
      if(!confirm('Hapus aset ini sepenuhnya? Jurnal terkait tidak ikut terhapus otomatis.')) return;
      DB.aset = DB.aset.filter(x=>x.id!==a.id); save(); renderContent();
    });
  });
};

  document.getElementById('expJurnal').addEventListener('click', ()=>{
    const rows = [['Tanggal','Keterangan','Akun Debit','Akun Kredit','Nominal','Sumber','Tag']];
    DB.jurnal.forEach(j=> rows.push([j.tanggal,j.keterangan,akunById(j.debitId)?.nama,akunById(j.kreditId)?.nama,j.nominal,j.sumber,(j.tags||[]).join('|')]));
    downloadCsv('jurnal.csv', rows);
  });
  document.getElementById('expPembelian').addEventListener('click', ()=>{
    const rows = [['Tanggal','Dibayar Melalui','Barang','Qty','Total','Keterangan']];
    DB.pembelian.forEach(p=> rows.push([p.tanggal, akunById(p.bayarId)?.nama, DB.produk.find(x=>x.id===p.produkId)?.nama, p.qty, p.total, p.keterangan]));
    downloadCsv('pembelian.csv', rows);
  });
};

/* ================= EXPORT / IMPORT / INIT ================= */
function initApp(){
  load();
  if(!DB.currentUserId){ renderLoginScreen(); return; }
  finishInit();
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

function finishInit(){
  renderNav();
  switchTab('dashboard');
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
  const u = getCurrentUser();
  const actions = document.getElementById('topbar-actions');
  if(u && actions && !document.getElementById('userBadge')){
    const span = document.createElement('span');
    span.id = 'userBadge'; span.className='mini';
    span.style.marginRight='8px';
    span.textContent = u.email+' ('+u.role+')';
    actions.prepend(span);
    const logoutBtn = document.createElement('button');
    logoutBtn.className='btn small'; logoutBtn.textContent='Keluar';
    logoutBtn.addEventListener('click', logout);
    actions.appendChild(logoutBtn);
  }

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'inspira-ledger-backup-'+todayStr()+'.json';
    a.click(); URL.revokeObjectURL(url);
    toast('Backup diunduh');
  });
  document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.coa) throw new Error('format tidak dikenali');
        if(!confirm('Restore akan menimpa semua data saat ini. Lanjutkan?')) return;
        DB = data; save(); switchTab('dashboard'); toast('Data berhasil di-restore');
      }catch(err){ toast('File tidak valid: '+err.message); }
    };
    reader.readAsText(file);
  });
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
<script>
  // Register service worker for offline support (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW registration failed:', err));
    });
  }
  // Optional: show a lightweight "Install app" button when the browser allows it
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.createElement('button');
    btn.textContent = '⬇ Install Aplikasi';
    btn.className = 'btn primary';
    btn.style.marginRight = '8px';
    btn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      btn.remove();
    });
    const actions = document.getElementById('topbar-actions');
    if (actions) actions.prepend(btn);
  });
</script>
