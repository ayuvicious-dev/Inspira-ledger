/* ================= PERUBAHAN MODAL ================= */
RENDERERS.perubahanmodal = function(c){
  let html = `<div class="tablewrap"><table class="sheet"><thead><tr><th>Entitas</th><th>Modal Awal</th><th>Laba Berjalan</th><th>Prive</th><th>Modal Akhir</th></tr></thead><tbody>`;
  let tAwal=0,tLaba=0,tPrive=0,tAkhir=0;
  KEPEMILIKAN.forEach(kep=>{
    const modalAkun = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep && !a.nama.startsWith('Prive'));
    const priveAkun = DB.coa.filter(a=>a.kategori==='MD' && a.kepemilikan===kep && a.nama.startsWith('Prive'));
    const modalAwal = modalAkun.reduce((s,a)=>s+saldoAkun(a.id),0);
    const laba = labaRugiPerKepemilikan(kep);
    const prive = priveAkun.reduce((s,a)=>s+saldoAkun(a.id),0);
    const akhir = modalAwal + laba - prive;
    tAwal+=modalAwal; tLaba+=laba; tPrive+=prive; tAkhir+=akhir;
    html += `<tr><td><span class="tag ${tagClassKep(kep)}">${kep}</span></td><td class="num">${fmtRp(modalAwal)}</td><td class="num">${fmtRp(laba)}</td><td class="num">${fmtRp(prive)}</td><td class="num" style="font-weight:700">${fmtRp(akhir)}</td></tr>`;
  });
  html += `<tr style="font-weight:700"><td>Total</td><td class="num">${fmtRp(tAwal)}</td><td class="num">${fmtRp(tLaba)}</td><td class="num">${fmtRp(tPrive)}</td><td class="num">${fmtRp(tAkhir)}</td></tr>`;
  html += `</tbody></table></div><div class="mini" style="margin-top:10px">Prive dicatat lewat Jurnal Umum / Kirim Uang dengan akun lawan "Prive [Entitas]".</div>`;
  c.innerHTML = html;
};

/* ================= ARUS KAS ================= */
RENDERERS.aruskas = function(c){
  const kasIds = new Set(DB.coa.filter(a=>a.kategori==='AL').map(a=>a.id));
  const groups = { Operasional:0, Investasi:0, Pendanaan:0 };
  const rows = [];
  DB.jurnal.forEach(j=>{
    const debitKas = kasIds.has(j.debitId), kreditKas = kasIds.has(j.kreditId);
    if(!debitKas && !kreditKas) return;
    if(debitKas && kreditKas) return; // transfer internal, netral
    const lawanId = debitKas? j.kreditId : j.debitId;
    const lawan = akunById(lawanId);
    const arah = debitKas? 1 : -1; // masuk / keluar
    let kelompok = 'Operasional';
    if(lawan){
      if(['AT','ALN'].includes(lawan.kategori)) kelompok='Investasi';
      else if(['KW','MD'].includes(lawan.kategori)) kelompok='Pendanaan';
      else kelompok='Operasional';
    }
    groups[kelompok] += arah*j.nominal;
    rows.push({...j, arah, kelompok, lawanNama: lawan?lawan.nama:'?'});
  });
  const totalKas = groups.Operasional+groups.Investasi+groups.Pendanaan;
  let html = `<div class="grid cols-3">
    <div class="card kpi"><div class="label">Aktivitas Operasional</div><div class="value ${groups.Operasional>=0?'pos':'neg'}">${fmtRp(groups.Operasional)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Investasi</div><div class="value ${groups.Investasi>=0?'pos':'neg'}">${fmtRp(groups.Investasi)}</div></div>
    <div class="card kpi"><div class="label">Aktivitas Pendanaan</div><div class="value ${groups.Pendanaan>=0?'pos':'neg'}">${fmtRp(groups.Pendanaan)}</div></div>
  </div>
  <div class="card kpi" style="margin-top:14px;max-width:320px"><div class="label">Kenaikan (Penurunan) Kas Bersih</div><div class="value ${totalKas>=0?'pos':'neg'}">${fmtRp(totalKas)}</div></div>
  <div class="card" style="margin-top:14px">
  <div class="section-title"><h3>Rincian Pergerakan Kas</h3></div>
  <div class="tablewrap"><table class="sheet"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kelompok</th><th>Akun Lawan</th><th>Arah</th><th>Nominal</th></tr></thead><tbody>
  ${rows.length? [...rows].reverse().map(r=>`<tr><td>${r.tanggal}</td><td>${r.keterangan||'-'}</td><td>${r.kelompok}</td><td>${r.lawanNama}</td><td>${r.arah>0?'Masuk':'Keluar'}</td><td class="num" style="color:${r.arah>0?'var(--debit)':'var(--kredit)'}">${fmtRp(r.arah*r.nominal)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pergerakan kas</td></tr>'}
  </tbody></table></div></div>
  <div class="mini" style="margin-top:8px">Pengelompokan otomatis: Investasi = lawan akun Aset Tetap/Aset Lainnya, Pendanaan = lawan akun Kewajiban/Modal, sisanya Operasional.</div>`;
  c.innerHTML = html;
};

/* ================= EXPORT / IMPORT / INIT ================= */
function initApp(){
  load();
  renderNav();
  switchTab('dashboard');

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'inspira-ledger-backup-'+todayStr()+'.json';
    a.click(); URL.revokeObjectURL(url);
    toast('Backup diunduh');
  });
  document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.coa) throw new Error('format tidak dikenali');
        if(!confirm('Restore akan menimpa semua data saat ini. Lanjutkan?')) return;
        DB = data; save(); switchTab('dashboard'); toast('Data berhasil di-restore');
      }catch(err){ toast('File tidak valid: '+err.message); }
    };
    reader.readAsText(file);
  });
}

document.addEventListener('DOMContentLoaded', initApp);
